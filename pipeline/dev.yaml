trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main
      - feature/*

pool:
  name: sumsungprojectagentpool
  demands:
    - Agent.Name -equals DESKTOP-7H76R0M

variables:
  terraformVersion: '1.6.6'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:
  - stage: Terraform_CI
    displayName: 'Terraform Init Fmt Validate Plan'

    jobs:
      - job: Terraform_Job
        displayName: 'Terraform Pipeline'

        steps:
          - checkout: self

          # Install Terraform
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          # Terraform Init
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: 'sumsungprojectservcon'

          # Terraform Format Check
          - task: TerraformTaskV4@4
            displayName: 'Terraform Fmt'
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: $(workingDirectory)
              customCommand: 'fmt -check -recursive'

          # Terraform Validate
          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(workingDirectory)

          # Terraform Plan
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: 'sumsungprojectservcon'